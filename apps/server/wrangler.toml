name = "typohero"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/songs/*", "/room/*"]

[[r2_buckets]]
binding = "SONGS"
bucket_name = "typohero-songs"
preview_bucket_name = "typohero-songs"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
